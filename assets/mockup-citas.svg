    <g><rect x="242" y="104" width="76" height="88" rx="9" fill="#d3f9ee"/><rect x="242" y="104" width="4" height="88" rx="2" fill="#0ca678"/><text x="252" y="124" font-size="10" font-weight="800" fill="#087f5b">Servicio</text><text x="252" y="140" font-size="9" fill="#0ca678">M. Torres</text><text x="252" y="178" font-size="9" fill="#12b886">09:00–10:30</text></g>
